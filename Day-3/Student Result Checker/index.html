
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <section class="result-card">

            <div class="header">
                <span class="tag">STUDENT PORTAL</span>
                <h1>Result Checker</h1>
                <p>Check your examination performance</p>
            </div>

            <div class="marks-box">
                <span>Your Marks</span>
                <h2 id="marks">--</h2>
            </div>

            <div class="result-details">
                <div class="detail">
                    <span>Result Status</span>
                    <strong id="resultStatus">Waiting...</strong>
                </div>

                <div class="detail">
                    <span>Your Grade</span>
                    <strong id="grade">--</strong>
                </div>
            </div>

            <div class="footer">
                <p>Keep learning. Keep improving.</p>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
