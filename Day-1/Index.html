
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <section class="card">

            <p class="tag">JAVASCRIPT LOGIC BUILDING</p>

            <h1>Factorial Calculator</h1>

            <p class="subtitle">
                Calculate the factorial of any non-negative whole number.
            </p>

            <div class="result-box">
                <span>Entered Number</span>
                <h2 id="number">--</h2>
            </div>

            <div class="result-box">
                <span>Factorial Result</span>
                <h2 id="factorial">Waiting...</h2>
            </div>

            <p class="footer">
                Powered by JavaScript Loops
            </p>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
