
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bill Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <section class="bill-card">

            <div class="header">
                <span class="tag">SHOPPING TOOL</span>
                <h1>Bill Calculator</h1>
                <p>Calculate your shopping expenses</p>
            </div>

            <div class="product-list">
                <div class="product">
                    <div>
                        <h3>Keyboard</h3>
                        <p>Product 01</p>
                    </div>
                    <strong id="price1">₹0</strong>
                </div>

                <div class="product">
                    <div>
                        <h3>Mouse</h3>
                        <p>Product 02</p>
                    </div>
                    <strong id="price2">₹0</strong>
                </div>

                <div class="product">
                    <div>
                        <h3>Headphones</h3>
                        <p>Product 03</p>
                    </div>
                    <strong id="price3">₹0</strong>
                </div>
            </div>

            <div class="summary">
                <div class="summary-item">
                    <span>Total Quantity</span>
                    <strong id="totalQuantity">0</strong>
                </div>

                <div class="total">
                    <span>Total Amount</span>
                    <h2 id="totalAmount">₹0</h2>
                </div>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
